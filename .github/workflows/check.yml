# Checks that run on every change, outside the release path.
name: Check

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'plugins/swe-assistant/**'
      - 'scripts/check-trigger-routing.py'
      - 'scripts/trigger-routing-baseline.json'

jobs:
  trigger-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # Every trigger phrase a skill's description quotes should route to that
      # skill. Ratcheted against a baseline: new misses fail, and so does a
      # baseline entry that has since been fixed.
      - run: python scripts/check-trigger-routing.py
